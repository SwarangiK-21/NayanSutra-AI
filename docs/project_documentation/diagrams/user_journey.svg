<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13">
  <title>User journey through NyaySutra</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/>
    </marker>
    <style>
      .b{fill:#fff;stroke:#0b2c5f;stroke-width:1.5}
      .k{fill:#0b2c5f}
      .n{fill:#fff;font-weight:700;font-size:13px}
      .h{font-weight:700;fill:#0b2c5f;font-size:13px}
      .s{fill:#5a6577;font-size:11.2px}
      .ln{stroke:#5a6577;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <g>
    <rect class="b" x="10" y="20" width="182" height="120" rx="8"/><circle class="k" cx="30" cy="40" r="12"/><text class="n" x="26" y="45">1</text>
    <text class="h" x="48" y="45">Sign up / sign in</text>
    <text class="s" x="22" y="68">verify e-mail · set up the</text>
    <text class="s" x="22" y="84">authenticator code (2-step)</text>
    <text class="s" x="22" y="104">new accounts = Lawyer</text>
    <text class="s" x="22" y="120">(admins are appointed)</text>
  </g>
  <g>
    <rect class="b" x="208" y="20" width="182" height="120" rx="8"/><circle class="k" cx="228" cy="40" r="12"/><text class="n" x="224" y="45">2</text>
    <text class="h" x="246" y="45">Create a case</text>
    <text class="s" x="220" y="68">parties, court, state,</text>
    <text class="s" x="220" y="84">hearing date, facts</text>
    <text class="s" x="220" y="104">upload papers (PDF, scans,</text>
    <text class="s" x="220" y="120">Word, Excel, photos…)</text>
  </g>
  <g>
    <rect class="b" x="406" y="20" width="182" height="120" rx="8"/><circle class="k" cx="426" cy="40" r="12"/><text class="n" x="422" y="45">3</text>
    <text class="h" x="444" y="45">Ask a question</text>
    <text class="s" x="418" y="68">Legal Research page:</text>
    <text class="s" x="418" y="84">choose matter, scope and</text>
    <text class="s" x="418" y="100">jurisdiction; type or speak</text>
    <text class="s" x="418" y="120">(English, Hindi, Marathi)</text>
  </g>
  <g>
    <rect class="b" x="604" y="20" width="182" height="120" rx="8"/><circle class="k" cx="624" cy="40" r="12"/><text class="n" x="620" y="45">4</text>
    <text class="h" x="642" y="45">Read the answer</text>
    <text class="s" x="616" y="68">streamed with [1] [2]</text>
    <text class="s" x="616" y="84">citations; Sources panel;</text>
    <text class="s" x="616" y="100">citation-audit result;</text>
    <text class="s" x="616" y="120">"how it was produced"</text>
  </g>
  <g>
    <rect class="b" x="802" y="20" width="188" height="120" rx="8"/><circle class="k" cx="822" cy="40" r="12"/><text class="n" x="818" y="45">5</text>
    <text class="h" x="840" y="45">Check the source</text>
    <text class="s" x="814" y="68">click a citation → exact</text>
    <text class="s" x="814" y="84">passage + original PDF</text>
    <text class="s" x="814" y="100">page (India Code copy or</text>
    <text class="s" x="814" y="120">the case document)</text>
  </g>
  <path class="ln" d="M192,80 L204,80"/><path class="ln" d="M390,80 L402,80"/><path class="ln" d="M588,80 L600,80"/><path class="ln" d="M786,80 L798,80"/>

  <g>
    <rect class="b" x="10" y="170" width="236" height="110" rx="8"/><circle class="k" cx="30" cy="190" r="12"/><text class="n" x="26" y="195">6</text>
    <text class="h" x="48" y="195">Draft</text>
    <text class="s" x="22" y="218">plaint, notice, bail application…</text>
    <text class="s" x="22" y="236">from template + case papers; edit,</text>
    <text class="s" x="22" y="254">review, approve, export Word/PDF</text>
  </g>
  <g>
    <rect class="b" x="258" y="170" width="236" height="110" rx="8"/><circle class="k" cx="278" cy="190" r="12"/><text class="n" x="274" y="195">7</text>
    <text class="h" x="296" y="195">Plan the work</text>
    <text class="s" x="270" y="218">Calendar: hearings, deadlines,</text>
    <text class="s" x="270" y="236">tasks; reminders in the bell</text>
    <text class="s" x="270" y="254">(e-mail only if configured)</text>
  </g>
  <g>
    <rect class="b" x="506" y="170" width="236" height="110" rx="8"/><circle class="k" cx="526" cy="190" r="12"/><text class="n" x="522" y="195">8</text>
    <text class="h" x="544" y="195">Come back later</text>
    <text class="s" x="518" y="218">Recent History drawer: reopen</text>
    <text class="s" x="518" y="236">past conversations and searches</text>
    <text class="s" x="518" y="254">(private to each user)</text>
  </g>
  <g>
    <rect class="b" x="754" y="170" width="236" height="110" rx="8"/><circle class="k" cx="774" cy="190" r="12"/><text class="n" x="770" y="195">9</text>
    <text class="h" x="792" y="195">Extend the law library</text>
    <text class="s" x="766" y="218">Bare Acts → All-India catalogue:</text>
    <text class="s" x="766" y="236">find a state's act on India Code</text>
    <text class="s" x="766" y="254">and add it for research</text>
  </g>
  <path class="ln" d="M896,140 C896,158 128,152 128,166"/>
</svg>
