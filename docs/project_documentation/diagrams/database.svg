<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12">
  <title>Simplified database design (main tables only; sanitised)</title>
  <defs>
    <style>
      .t{fill:#fff;stroke:#0b2c5f;stroke-width:1.4}
      .hd{fill:#0b2c5f}
      .hn{fill:#fff;font-weight:700;font-size:12.5px}
      .f{fill:#1a2230;font-size:11.2px}
      .k{fill:#5a6577;font-size:11.2px}
      .p{fill:#fff8ee;stroke:#d9750f;stroke-width:1.2}
      .ln{stroke:#8a96a8;stroke-width:1.3;fill:none}
      .z{font-weight:700;fill:#5a6577;font-size:11.5px;letter-spacing:.04em}
    </style>
  </defs>
  <!-- people -->
  <text class="z" x="20" y="22">PEOPLE &amp; ACCESS</text>
  <g><rect class="t" x="20" y="30" width="180" height="96" rx="6"/><rect class="hd" x="20" y="30" width="180" height="22" rx="6"/>
    <text class="hn" x="30" y="46">profiles</text><text class="f" x="30" y="68">user_id (from Supabase Auth)</text><text class="f" x="30" y="84">e-mail, name, status</text><text class="f" x="30" y="100">two-step on/off</text></g>
  <g><rect class="t" x="20" y="140" width="180" height="80" rx="6"/><rect class="hd" x="20" y="140" width="180" height="22" rx="6"/>
    <text class="hn" x="30" y="156">memberships</text><text class="f" x="30" y="178">user → organisation</text><text class="f" x="30" y="194">role: Lawyer | Administrator</text></g>
  <g><rect class="t" x="20" y="234" width="180" height="64" rx="6"/><rect class="hd" x="20" y="234" width="180" height="22" rx="6"/>
    <text class="hn" x="30" y="250">invitations</text><text class="f" x="30" y="272">e-mail, role, expiry</text></g>
  <g><rect class="t" x="20" y="312" width="180" height="80" rx="6"/><rect class="hd" x="20" y="312" width="180" height="22" rx="6"/>
    <text class="hn" x="30" y="328">app_sessions</text><text class="f" x="30" y="350">hashed session id, expiry</text><text class="f" x="30" y="366">token kept in Vault</text></g>

  <!-- matters -->
  <text class="z" x="240" y="22">MATTERS</text>
  <g><rect class="t" x="240" y="30" width="200" height="112" rx="6"/><rect class="hd" x="240" y="30" width="200" height="22" rx="6"/>
    <text class="hn" x="250" y="46">cases</text><text class="f" x="250" y="68">title, type, court, state</text><text class="f" x="250" y="84">parties, CNR / FIR numbers</text><text class="f" x="250" y="100">next hearing date, status</text><text class="f" x="250" y="116">facts (description)</text></g>
  <g><rect class="t" x="240" y="156" width="200" height="80" rx="6"/><rect class="hd" x="240" y="156" width="200" height="22" rx="6"/>
    <text class="hn" x="250" y="172">case_members</text><text class="f" x="250" y="194">who may open a case</text><text class="f" x="250" y="210">access: owner | lawyer</text></g>
  <g><rect class="t" x="240" y="250" width="200" height="64" rx="6"/><rect class="hd" x="240" y="250" width="200" height="22" rx="6"/>
    <text class="hn" x="250" y="266">case_notes · case_provisions</text><text class="f" x="250" y="288">notes, suggested sections</text></g>
  <g><rect class="t" x="240" y="328" width="200" height="80" rx="6"/><rect class="hd" x="240" y="328" width="200" height="22" rx="6"/>
    <text class="hn" x="250" y="344">drafts (+ versions)</text><text class="f" x="250" y="366">content, facts used, sources</text><text class="f" x="250" y="382">review: draft / approved</text></g>

  <!-- documents -->
  <text class="z" x="480" y="22">DOCUMENTS &amp; SEARCH</text>
  <g><rect class="t" x="480" y="30" width="230" height="112" rx="6"/><rect class="hd" x="480" y="30" width="230" height="22" rx="6"/>
    <text class="hn" x="490" y="46">documents</text><text class="f" x="490" y="68">collection: case | bare act |</text><text class="f" x="490" y="84">judgment | template</text><text class="f" x="490" y="100">jurisdiction, status, checksum</text><text class="f" x="490" y="116">path → file in Storage</text></g>
  <g><rect class="t" x="480" y="156" width="230" height="96" rx="6"/><rect class="hd" x="480" y="156" width="230" height="22" rx="6"/>
    <text class="hn" x="490" y="172">chunks (passages)</text><text class="f" x="490" y="194">text, page numbers, section label</text><text class="f" x="490" y="210">emb: 384-number meaning vector</text><text class="f" x="490" y="226">fts: keyword index</text></g>
  <g><rect class="t" x="480" y="266" width="230" height="64" rx="6"/><rect class="hd" x="480" y="266" width="230" height="22" rx="6"/>
    <text class="hn" x="490" y="282">doc_derivatives</text><text class="f" x="490" y="304">translations and summaries</text></g>
  <rect class="p" x="480" y="344" width="230" height="64" rx="6"/>
  <text class="hn" x="490" y="364" style="fill:#8a4b00">Storage bucket "case-files"</text>
  <text class="f" x="490" y="384">private; original uploaded files</text><text class="f" x="490" y="400">only reached through the server</text>

  <!-- personal -->
  <text class="z" x="750" y="22">PERSONAL (owner only)</text>
  <g><rect class="t" x="750" y="30" width="230" height="64" rx="6"/><rect class="hd" x="750" y="30" width="230" height="22" rx="6"/>
    <text class="hn" x="760" y="46">chats → messages</text><text class="f" x="760" y="72">questions, answers, sources</text></g>
  <g><rect class="t" x="750" y="108" width="230" height="64" rx="6"/><rect class="hd" x="750" y="108" width="230" height="22" rx="6"/>
    <text class="hn" x="760" y="124">search_history</text><text class="f" x="760" y="150">query, filters, result count</text></g>
  <g><rect class="t" x="750" y="186" width="230" height="80" rx="6"/><rect class="hd" x="750" y="186" width="230" height="22" rx="6"/>
    <text class="hn" x="760" y="202">calendar_events</text><text class="f" x="760" y="224">hearing / deadline / task, date,</text><text class="f" x="760" y="240">time zone, priority, status</text></g>
  <g><rect class="t" x="750" y="280" width="230" height="64" rx="6"/><rect class="hd" x="750" y="280" width="230" height="22" rx="6"/>
    <text class="hn" x="760" y="296">event_reminders</text><text class="f" x="760" y="318">when (UTC), channel, sent?</text></g>
  <g><rect class="t" x="750" y="358" width="230" height="50" rx="6"/><rect class="hd" x="750" y="358" width="230" height="22" rx="6"/>
    <text class="hn" x="760" y="374">notifications · user_prefs</text><text class="f" x="760" y="398">bell items, language, settings</text></g>

  <!-- system -->
  <text class="z" x="20" y="440">SYSTEM</text>
  <rect class="t" x="20" y="448" width="960" height="96" rx="6"/>
  <text class="f" x="34" y="472"><tspan font-weight="700">jobs</tspan> — background work queue (state, progress, attempts, errors) · <tspan font-weight="700">upload_batches / batch_items</tspan> — bulk uploads</text>
  <text class="f" x="34" y="494"><tspan font-weight="700">audit_log</tspan> — who did what, when, from where (never document contents; cannot be edited or deleted by the app)</text>
  <text class="f" x="34" y="516"><tspan font-weight="700">integrations / sync_log / source_records</tspan> — LiveLaw and India Code checks · <tspan font-weight="700">organizations, org_settings, meta</tspan></text>
  <text class="k" x="34" y="536">Also: recovery_codes (hashed), auth_throttle (lockout counters). 34 tables in total, every one with row-level security enabled.</text>

  <path class="ln" d="M200,180 L240,190"/><path class="ln" d="M340,142 L340,156"/><path class="ln" d="M340,236 L340,250"/>
  <path class="ln" d="M440,86 L480,86"/><path class="ln" d="M595,142 L595,156"/><path class="ln" d="M595,252 L595,266"/>
  <path class="ln" d="M595,330 L595,344"/><path class="ln" d="M440,368 L480,100"/><path class="ln" d="M865,266 L865,280"/>
</svg>
