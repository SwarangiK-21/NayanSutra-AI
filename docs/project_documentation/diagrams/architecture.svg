<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13">
  <title>NyaySutra system architecture (verified components)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#0b2c5f;stroke-width:1.5}
      .zone{fill:#f4f6fa;stroke:#c9d2e0;stroke-dasharray:5 4}
      .ext{fill:#fff8ee;stroke:#d9750f;stroke-width:1.5}
      .sb{fill:#eef7ec;stroke:#138808;stroke-width:1.5}
      .h{font-weight:700;fill:#0b2c5f;font-size:14px}
      .t{fill:#1a2230}
      .s{fill:#5a6577;font-size:11.5px}
      .z{font-weight:700;fill:#5a6577;font-size:12px;letter-spacing:.04em}
      .ln{stroke:#5a6577;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dl{stroke:#5a6577;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>

  <!-- User / browser -->
  <rect class="zone" x="20" y="20" width="200" height="600" rx="10"/>
  <text class="z" x="36" y="44">USER'S COMPUTER</text>
  <rect class="box" x="36" y="64" width="168" height="190" rx="8"/>
  <text class="h" x="50" y="88">Web browser</text>
  <text class="t" x="50" y="110">NyaySutra web app</text>
  <text class="s" x="50" y="130">HTML + CSS + plain</text>
  <text class="s" x="50" y="146">JavaScript (no framework)</text>
  <text class="s" x="50" y="168">English / हिंदी screens</text>
  <text class="s" x="50" y="188">Voice input uses the</text>
  <text class="s" x="50" y="204">browser's own speech</text>
  <text class="s" x="50" y="220">service (optional)</text>
  <text class="s" x="50" y="242">Holds only a session cookie</text>

  <!-- Backend -->
  <rect class="zone" x="250" y="20" width="420" height="600" rx="10"/>
  <text class="z" x="266" y="44">NYAYSUTRA SERVER (Python · FastAPI)</text>
  <rect class="box" x="266" y="64" width="388" height="80" rx="8"/>
  <text class="h" x="280" y="88">Web API + security layer</text>
  <text class="s" x="280" y="108">~114 API routes · sessions · CSRF · rate limits · roles</text>
  <text class="s" x="280" y="126">(Lawyer / Administrator) · case-level access checks</text>

  <rect class="box" x="266" y="158" width="188" height="150" rx="8"/>
  <text class="h" x="280" y="182">Research agent</text>
  <text class="s" x="280" y="202">guardrails → plan → tool</text>
  <text class="s" x="280" y="220">retrieve → answer →</text>
  <text class="s" x="280" y="238">citation check</text>
  <text class="s" x="280" y="260">tools: research, drafting,</text>
  <text class="s" x="280" y="278">document analysis, limitation</text>
  <text class="s" x="280" y="296">calculator, short chat</text>

  <rect class="box" x="466" y="158" width="188" height="150" rx="8"/>
  <text class="h" x="480" y="182">Search engine (RAG)</text>
  <text class="s" x="480" y="202">exact section lookup</text>
  <text class="s" x="480" y="220">+ keyword search</text>
  <text class="s" x="480" y="238">+ meaning (vector) search</text>
  <text class="s" x="480" y="256">→ re-ranking</text>
  <text class="s" x="480" y="278">jurisdiction filter</text>
  <text class="s" x="480" y="296">(central + one state)</text>

  <rect class="box" x="266" y="322" width="388" height="96" rx="8"/>
  <text class="h" x="280" y="346">Background workers</text>
  <text class="s" x="280" y="366">read files (PDF, Word, Excel, CSV, images) · OCR · chunk · index</text>
  <text class="s" x="280" y="384">translations, summaries, drafts, provisions (durable job queue)</text>
  <text class="s" x="280" y="402">calendar reminder dispatcher · scheduled source checks</text>

  <rect class="box" x="266" y="432" width="388" height="80" rx="8"/>
  <text class="h" x="280" y="456">Local AI models (run on this server)</text>
  <text class="s" x="280" y="476">bge-small-en-v1.5 (embeddings) · MiniLM re-ranker</text>
  <text class="s" x="280" y="494">RapidOCR (scanned pages; English, Hindi, Marathi)</text>

  <rect class="box" x="266" y="526" width="388" height="80" rx="8"/>
  <text class="h" x="280" y="550">Privacy filter</text>
  <text class="s" x="280" y="570">Aadhaar, PAN, phone, e-mail, account nos. → placeholders</text>
  <text class="s" x="280" y="588">before text goes to the language model; logs redacted</text>

  <!-- Supabase -->
  <rect class="zone" x="700" y="20" width="280" height="300" rx="10"/>
  <text class="z" x="716" y="44">SUPABASE (cloud, Mumbai region)</text>
  <rect class="sb" x="716" y="60" width="248" height="58" rx="8"/>
  <text class="h" x="730" y="82">Auth</text>
  <text class="s" x="730" y="102">accounts, e-mail verification, 2-step codes</text>
  <rect class="sb" x="716" y="128" width="248" height="70" rx="8"/>
  <text class="h" x="730" y="150">Postgres database</text>
  <text class="s" x="730" y="170">34 tables, row-level security on all</text>
  <text class="s" x="730" y="188">cases, documents, passages, chats…</text>
  <rect class="sb" x="716" y="208" width="248" height="46" rx="8"/>
  <text class="h" x="730" y="230">Storage</text>
  <text class="s" x="730" y="246">private bucket "case-files"</text>
  <rect class="sb" x="716" y="264" width="248" height="46" rx="8"/>
  <text class="h" x="730" y="286">Vault</text>
  <text class="s" x="730" y="302">encrypted sign-in tokens</text>

  <!-- External -->
  <rect class="zone" x="700" y="338" width="280" height="282" rx="10"/>
  <text class="z" x="716" y="362">EXTERNAL SERVICES</text>
  <rect class="ext" x="716" y="376" width="248" height="58" rx="8"/>
  <text class="h" x="730" y="398">Ollama Cloud (language model)</text>
  <text class="s" x="730" y="418">gpt-oss:120b answers · gpt-oss:20b fast</text>
  <rect class="ext" x="716" y="444" width="248" height="58" rx="8"/>
  <text class="h" x="730" y="466">India Code (official API)</text>
  <text class="s" x="730" y="486">central + state acts, update checks</text>
  <rect class="ext" x="716" y="512" width="248" height="40" rx="8"/>
  <text class="h" x="730" y="537">LiveLaw RSS (news headlines)</text>
  <rect class="ext" x="716" y="562" width="248" height="46" rx="8"/>
  <text class="t" x="730" y="582">Court portals, Indian Kanoon:</text>
  <text class="s" x="730" y="598">opened by people, not called by code</text>

  <!-- arrows -->
  <path class="ln" d="M204,150 L262,104"/>
  <text class="s" x="214" y="118">HTTPS</text>
  <path class="ln" d="M360,144 L360,154"/>
  <path class="ln" d="M454,232 L462,232"/>
  <path class="ln" d="M654,89 L712,89"/>
  <path class="ln" d="M654,200 L712,165"/>
  <path class="ln" d="M654,360 L712,232"/>
  <path class="ln" d="M654,566 L712,405"/>
  <path class="ln" d="M654,380 L712,472"/>
  <path class="ln" d="M654,400 L712,532"/>
</svg>
